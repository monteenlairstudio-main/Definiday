name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # Without the secret (forks, PRs from forks) the release APK falls back to the debug key.
      - name: Decode release keystore
        env: { KEYSTORE_BASE64: "${{ secrets.DEFINIDAY_KEYSTORE_BASE64 }}" }
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "No keystore secret: debug signing"; exit 0; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/definiday.jks"
          echo "DEFINIDAY_KEYSTORE=$RUNNER_TEMP/definiday.jks" >> "$GITHUB_ENV"
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
        env:
          DEFINIDAY_KEYSTORE_PASSWORD: ${{ secrets.DEFINIDAY_KEYSTORE_PASSWORD }}
          DEFINIDAY_KEY_ALIAS: ${{ secrets.DEFINIDAY_KEY_ALIAS }}
          DEFINIDAY_KEY_PASSWORD: ${{ secrets.DEFINIDAY_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: definiday
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/demo/*.png
