name: build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  # Every branch and PR: no secret at all, the release APK falls back to the debug key.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: 21 }
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: definiday-debug-signed
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/demo/

  # main and tags only. Signing secrets are repository secrets for now (owner choice); moving them to the "release" environment (main + tags rule) would restrict them further.
  release:
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: 21 }
      - name: Decode release keystore
        env: { KEYSTORE_BASE64: "${{ secrets.DEFINIDAY_KEYSTORE_BASE64 }}" }
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::DEFINIDAY_KEYSTORE_BASE64 missing from the release environment"; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/definiday.jks"
      - run: ./gradlew --no-daemon :app:assembleRelease
        env:
          DEFINIDAY_KEYSTORE: ${{ runner.temp }}/definiday.jks
          DEFINIDAY_KEYSTORE_PASSWORD: ${{ secrets.DEFINIDAY_KEYSTORE_PASSWORD }}
          DEFINIDAY_KEY_ALIAS: ${{ secrets.DEFINIDAY_KEY_ALIAS }}
          DEFINIDAY_KEY_PASSWORD: ${{ secrets.DEFINIDAY_KEY_PASSWORD }}
      - name: Delete keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/definiday.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: definiday-release
          path: app/build/outputs/apk/release/app-release.apk
